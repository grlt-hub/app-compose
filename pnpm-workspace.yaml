packages:
  - packages/*
  - documentation

allowBuilds:
  es5-ext: true
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true

minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - wrangler@4.153.0
  - miniflare@5.20261023.0-beta

# Monaco pins DOMPurify 3.4.15, which is vulnerable to GHSA-p98j-92pf-mc4p.
overrides:
  monaco-editor>dompurify: 3.4.17

patchedDependencies:
  monaco-editor@0.57.0: patches/monaco-editor@0.57.0.patch
